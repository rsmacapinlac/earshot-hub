<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earshot hub</title>
<style>
  :root {
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-sans: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --color-bg:#f9f9f9; --color-surface:#fff; --color-surface-hover:#f5f5f5;
    --color-text:#222; --color-text-secondary:#666; --color-muted:#b0b0b0; --color-border:#e0e0e0;
    --color-primary:#2a5d8f; --color-primary-rgb:42,93,143; --color-accent:#e4572e;
    --color-header-bg:rgba(255,255,255,.95);
    --color-success:#2e7d32; --color-warning:#ed6c02; --color-error:#d32f2f;
    --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-pill:20px;
    --shadow-lg:0 8px 25px rgba(0,0,0,.15);
    --shadow-focus:0 0 0 3px rgba(42,93,143,.15);
  }
  :root[data-theme="dark"] {
    --color-bg:#181a1b; --color-surface:#2a2a2a; --color-surface-hover:#3a3a3a;
    --color-text:#f9f9f9; --color-text-secondary:#ccc; --color-muted:#777; --color-border:#444;
    --color-primary:#4a90e2; --color-primary-rgb:74,144,226; --color-accent:#ff6f61;
    --color-header-bg:rgba(24,26,27,.95);
    --color-success:#66bb6a; --color-warning:#ffa726; --color-error:#ef5350;
    --shadow-focus:0 0 0 3px rgba(74,144,226,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg:#181a1b; --color-surface:#2a2a2a; --color-surface-hover:#3a3a3a;
      --color-text:#f9f9f9; --color-text-secondary:#ccc; --color-muted:#777; --color-border:#444;
      --color-primary:#4a90e2; --color-primary-rgb:74,144,226; --color-accent:#ff6f61;
      --color-header-bg:rgba(24,26,27,.95);
      --color-success:#66bb6a; --color-warning:#ffa726; --color-error:#ef5350;
    }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--color-bg); color:var(--color-text); font-family:var(--font-sans);
         min-height:100vh; transition:background .3s, color .3s; }
  a { color:inherit; }
  button { font-family:inherit; }
  input:focus, button:focus-visible, a:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
  @keyframes ledpulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes recring { 0%{transform:scale(1);opacity:.5} 100%{transform:scale(1.9);opacity:0} }
  @keyframes fadeup { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  @keyframes spin { to { transform:rotate(360deg) } }

  .wrap { max-width:1100px; margin:0 auto; }
  header.app { position:sticky; top:0; z-index:50; background:var(--color-header-bg);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--color-border); }
  header.app .row { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:14px 24px; }
  .brand { display:flex; align-items:center; gap:12px; cursor:pointer; background:none; border:none; padding:0; color:inherit; }
  .brand .mark { width:38px;height:38px;border-radius:var(--radius-md);background:var(--color-primary);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800; }
  .brand .name { font-family:var(--font-serif); font-weight:700; font-size:20px; line-height:1.1; }
  .brand .sub { font-family:var(--font-mono); font-size:11px; color:var(--color-muted); }
  nav.app { display:flex; gap:8px; }
  nav.app a { cursor:pointer; font-size:14px; font-weight:600; padding:7px 12px; border-radius:var(--radius-md);
    color:var(--color-text-secondary); text-decoration:none; }
  nav.app a.active { color:var(--color-text); background:var(--color-surface-hover); }
  .status-pill { display:flex; align-items:center; gap:9px; padding:6px 13px 6px 11px;
    border:1px solid var(--color-border); border-radius:var(--radius-pill); background:var(--color-surface); }
  .led { display:inline-block; width:11px; height:11px; border-radius:50%; }
  .status-pill .label { font-family:var(--font-mono); font-size:12px; color:var(--color-text-secondary); white-space:nowrap; }
  .icon-btn { width:40px;height:40px;border-radius:50%;border:1px solid var(--color-border);
    background:var(--color-surface);color:var(--color-text);cursor:pointer;font-size:16px; }

  main.app { padding:32px 24px 80px; }
  .view { animation:fadeup .3s ease; }
  .card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); }
  .btn { font-size:14px; font-weight:600; padding:9px 16px; border-radius:var(--radius-md);
    border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text);
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .btn:hover { background:var(--color-surface-hover); }
  .btn.primary { border-color:var(--color-primary); background:var(--color-primary); color:#fff; }
  .btn.primary.ghost { background:var(--color-surface); color:var(--color-primary); }
  .btn.danger { color:var(--color-error); }
  .btn[disabled] { opacity:.5; cursor:not-allowed; }
  .badge { display:inline-flex; align-items:center; font-size:12px; font-weight:600; padding:4px 12px;
    border-radius:var(--radius-pill); color:#fff; white-space:nowrap; }
  .mono { font-family:var(--font-mono); }
  .serif { font-family:var(--font-serif); }
  .muted { color:var(--color-muted); }
  .secondary { color:var(--color-text-secondary); }
  h1.title { font-family:var(--font-serif); font-weight:700; font-size:32px; margin:0; }
  h2.title { font-family:var(--font-serif); font-weight:700; font-size:28px; margin:0; }

  /* record hero */
  .hero { padding:32px; display:flex; align-items:center; gap:32px; flex-wrap:wrap; }
  .rec-btn-wrap { position:relative; width:112px; height:112px; flex-shrink:0; }
  .rec-btn { position:absolute; inset:8px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:var(--color-error);
    box-shadow:0 6px 16px rgba(211,47,47,.35); transition:all .2s; }
  .rec-btn .dot { width:30px;height:30px;border-radius:50%;background:#fff; }
  .rec-btn.recording { background:#fff; border:2px solid var(--color-error); box-shadow:none; }
  .rec-btn.recording .dot { width:26px;height:26px;border-radius:5px;background:var(--color-error); }
  .rec-ring { position:absolute; inset:8px; border-radius:50%; background:var(--color-error);
    animation:recring 1.4s ease-out infinite; }
  .disk-bar { height:8px; border-radius:99px; background:var(--color-surface-hover); overflow:hidden; border:1px solid var(--color-border); }
  .disk-bar > div { height:100%; transition:width .3s; }

  /* session rows */
  .rows { display:flex; flex-direction:column; gap:10px; }
  .srow { display:flex; align-items:center; gap:16px; padding:16px 20px; cursor:pointer;
    transition:border-color .15s, box-shadow .15s; }
  .srow:hover { border-color:var(--color-primary); box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .dot { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
  .empty { text-align:center; padding:72px 24px; border:1px dashed var(--color-border);
    border-radius:var(--radius-xl); background:var(--color-surface); }

  .name-input { font-family:var(--font-serif); font-weight:700; font-size:32px; line-height:1.15;
    margin:0 0 0 -8px; padding:2px 8px; border:1px solid transparent; background:transparent;
    color:var(--color-text); border-radius:var(--radius-md); min-width:280px; max-width:100%; }
  .name-input:hover { border-color:var(--color-border); }

  .panel { padding:24px 28px; }
  .seg { display:flex; gap:16px; margin-bottom:14px; line-height:1.7; }
  .seg .t { font-family:var(--font-mono); font-size:13px; color:var(--color-primary); flex-shrink:0; padding-top:1px; }
  .seg .text { font-size:16px; }
  .spk-turn { margin-bottom:20px; }
  .spk-input { margin-top:12px; width:100%; font-size:14px; font-weight:600; padding:9px 11px;
    border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .modal { background:var(--color-surface); border:1px solid var(--color-border);
    border-radius:var(--radius-xl); padding:28px; max-width:460px; width:100%; box-shadow:var(--shadow-lg); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:110;
    background:var(--color-text); color:var(--color-bg); font-size:14px; font-weight:500;
    padding:12px 20px; border-radius:var(--radius-pill); box-shadow:var(--shadow-lg); animation:fadeup .25s ease; }
  .spinner { width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%; animation:spin .8s linear infinite; display:inline-block; }
  @keyframes indet { 0%{background-position:-40% 0} 100%{background-position:140% 0} }
  .indet { height:8px; border-radius:99px; background:var(--color-surface-hover); overflow:hidden; border:1px solid var(--color-border); }
  .indet > div { height:100%; background:linear-gradient(90deg,transparent,var(--color-warning),transparent);
    background-size:40% 100%; background-repeat:no-repeat; animation:indet 1.15s ease-in-out infinite; }
  footer.app { border-top:1px solid var(--color-border); padding:22px 24px; }
  footer.app .row { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
    font-size:13px; color:var(--color-text-secondary); font-family:var(--font-mono); }
  input, button { color:inherit; }
  .field { width:100%; font-family:var(--font-mono); font-size:14px; padding:11px 14px;
    border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); }
  .grid2 { display:grid; grid-template-columns:auto 1fr; gap:12px 24px; font-size:14px; }
  @media (max-width:720px){ .diar-grid{ grid-template-columns:1fr !important; } }
</style>
</head>
<body>
  <header class="app">
    <div class="row wrap">
      <button class="brand" id="brand" aria-label="earshot hub home">
        <span class="mark" aria-hidden="true">◉</span>
        <span><span class="name">earshot hub</span><br><span class="sub">Raspberry Pi</span></span>
      </button>
      <nav class="app" aria-label="Primary">
        <a id="nav-sessions" href="#/">Sessions</a>
        <a id="nav-settings" href="#/settings">Settings</a>
      </nav>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="status-pill" title="Device status — mirrors the on-device LED" aria-live="polite">
          <span class="led" id="led"></span>
          <span class="label" id="device-label">Ready</span>
        </div>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle light and dark theme">🌙</button>
      </div>
    </div>
  </header>

  <main class="app wrap" id="view" aria-live="polite"></main>

  <footer class="app">
    <div class="row wrap">
      <span>earshot hub · Raspberry Pi 4B + ReSpeaker 2-Mic HAT</span>
      <span>Local-first capture · v1.3</span>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/app.js"></script>
</body>
</html>
